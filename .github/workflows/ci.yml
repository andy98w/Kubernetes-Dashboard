name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26.x', cache-dependency-path: api/go.sum }
      - run: go test ./...
        working-directory: api
      - run: go vet ./...
        working-directory: api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.context }}
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: scripts/validate-platform.sh
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: '1.16.0' }
      - run: terraform fmt -check -recursive infra/terraform
      - run: bash -n scripts/*.sh
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform/bootstrap
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform/environments/dev
