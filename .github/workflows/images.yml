name: Build and sign application images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api/**', 'web/**', '.github/workflows/images.yml', 'scripts/delivery/**']
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: kubevista-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: kubevista-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kubevista-api
            context: api
          - image: kubevista-web
            context: web

    steps:
      - uses: actions/checkout@v7

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: images-${{ matrix.image }}-${{ github.run_id }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Scan exact image before signing or promotion
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -v "$HOME/.docker:/root/.docker:ro" aquasec/trivy:0.69.3 image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"

      - name: Sign image digest with GitHub OIDC
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record deployable digest
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "\`${{ matrix.image }}\` → \`${IMAGE}@${DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"
          mkdir -p release
          jq -n --arg repository "$IMAGE" --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" '{repository:$repository,digest:$digest,revision:$revision}' > release/${{ matrix.image }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.image }}
          path: release/*.json

  staging-pr:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: python3 scripts/delivery/promote.py staging --artifacts release
      - name: Open staging promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/delivery/open-pr.sh staging
