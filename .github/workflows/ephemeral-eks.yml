name: Ephemeral EKS lifecycle

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply, destroy]
      confirmation:
        description: Type PLAN, APPLY, or DESTROY followed by kubevista-dev
        required: true
        type: string
      ttl_hours:
        description: ExpiresAt tag horizon for plan/apply
        required: true
        default: "8"
        type: choice
        options: ["4", "8", "12", "24"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: kubevista-terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.operation }} kubevista-dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: kubevista-ephemeral
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/environments/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_admin_principal_arn: ${{ vars.EKS_ADMIN_PRINCIPAL_ARN }}
      TF_VAR_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS_JSON }}
      TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
        run: |
          expected="$(printf '%s' "${OPERATION}" | tr '[:lower:]' '[:upper:]') kubevista-dev"
          if [[ "${CONFIRMATION}" != "${expected}" ]]; then
            echo "Expected confirmation: ${expected}" >&2
            exit 1
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: kubevista-${{ inputs.operation }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Set teardown deadline
        if: inputs.operation != 'destroy'
        run: echo "TF_VAR_expires_at=$(date -u -d '+${{ inputs.ttl_hours }} hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Initialize encrypted remote state
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=kubevista/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="use_lockfile=true"

      - name: Create reviewed plan
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          destroy_flag=()
          if [[ "${OPERATION}" == "destroy" ]]; then destroy_flag=(-destroy); fi
          terraform plan "${destroy_flag[@]}" -input=false -out=lifecycle.tfplan
          terraform show -no-color lifecycle.tfplan >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply saved plan
        if: inputs.operation != 'plan'
        run: terraform apply -input=false -auto-approve lifecycle.tfplan

      - name: Record cost-control reminder
        if: inputs.operation == 'apply'
        run: echo "Destroy this environment no later than ${TF_VAR_expires_at}." >> "${GITHUB_STEP_SUMMARY}"
