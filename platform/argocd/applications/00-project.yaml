apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubevista
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: KubeVista platform controllers, observability, and applications
  sourceRepos:
    - https://github.com/andy98w/Kubernetes-Dashboard.git
    - https://aws.github.io/eks-charts
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kubernetes-sigs.github.io/external-dns/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: observability }
    - { server: https://kubernetes.default.svc, namespace: kubevista }
    - { server: https://kubernetes.default.svc, namespace: external-dns }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
