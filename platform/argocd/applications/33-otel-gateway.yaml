apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-gateway
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "20" }
spec:
  project: kubevista
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.172.0
    helm:
      releaseName: otel-gateway
      values: |
        mode: deployment
        replicaCount: 2
        presets:
          kubernetesAttributes: { enabled: true }
          kubernetesEvents: { enabled: true }
          clusterMetrics: { enabled: true }
        image: { repository: otel/opentelemetry-collector-k8s }
        alternateConfig:
          extensions:
            health_check: { endpoint: "${env:MY_POD_IP}:13133" }
          receivers:
            otlp:
              protocols:
                grpc: { endpoint: "${env:MY_POD_IP}:4317" }
                http: { endpoint: "${env:MY_POD_IP}:4318" }
          processors:
            memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25 }
            batch: {}
          exporters:
            otlp/tempo:
              endpoint: tempo.observability.svc.cluster.local:4317
              tls: { insecure: true }
            otlphttp/loki:
              endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
            prometheus:
              endpoint: "${env:MY_POD_IP}:8889"
          service:
            extensions: [health_check]
            pipelines:
              traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }
              metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] }
              logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
        ports:
          jaeger-compact: { enabled: false }
          jaeger-thrift: { enabled: false }
          jaeger-grpc: { enabled: false }
          zipkin: { enabled: false }
          metrics: { enabled: true, containerPort: 8888, servicePort: 8888, protocol: TCP }
          prometheus: { enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP }
        serviceMonitor:
          enabled: true
          metricsEndpoints: [{ port: prometheus }]
          extraLabels: { release: monitoring }
        podDisruptionBudget: { enabled: true, minAvailable: 1 }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 1, memory: 1Gi }
  destination: { server: https://kubernetes.default.svc, namespace: observability }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5 }
