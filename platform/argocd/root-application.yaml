apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevista
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andy98w/Kubernetes-Dashboard.git
    targetRevision: main
    path: platform/apps/dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: kubevista
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 5 }
