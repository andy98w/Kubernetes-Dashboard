global:
  logging:
    format: json
    level: info
controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }
server:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
repoServer:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
applicationSet:
  replicas: 2
dex:
  enabled: false
notifications:
  enabled: false
