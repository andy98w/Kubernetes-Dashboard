apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevista-web
  labels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevista-web
  labels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web }
spec:
  replicas: {{ .Values.webReplicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: kubevista-web
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web } }
      containers:
        - name: web
          {{- if .Values.webImage.digest }}
          image: "{{ .Values.webImage.repository }}@{{ .Values.webImage.digest }}"
          {{- else }}
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10 }
          resources: {{ toYaml .Values.webResources | nindent 12 }}
          volumeMounts:
            - { name: nginx-tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      volumes:
        - name: nginx-tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kubevista-web
  labels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: kubevista-web }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: kubevista-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kubevista-web }
  minReplicas: {{ .Values.webAutoscaling.minReplicas }}
  maxReplicas: {{ .Values.webAutoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.webAutoscaling.cpuTarget }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: kubevista-web }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/component: smoke-test } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    {{- if .Values.ingress.enabled }}
    - from: [{ ipBlock: { cidr: {{ .Values.networkPolicy.loadBalancerSourceCidr | quote }} } }]
      ports: [{ protocol: TCP, port: 8080 }]
    {{- end }}
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: kubevista, app.kubernetes.io/component: api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
