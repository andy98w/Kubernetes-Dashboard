apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-smoke-test"
  labels:
    app.kubernetes.io/name: kubevista
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: health-check
      image: busybox:1.37.0
      command: [sh, -ec]
      args:
        - wget -qO- --timeout=5 http://kubevista-api/healthz;
          wget -qO- --timeout=5 http://kubevista-web/healthz;
          wget -qO- --timeout=5 http://kubevista-web/ | grep -q KubeVista
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { cpu: 50m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
        readOnlyRootFilesystem: true
