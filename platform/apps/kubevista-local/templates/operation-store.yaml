{{- if .Values.operations.durable }}
{{- if not .Values.operations.enabled }}
{{- fail "operations.durable requires operations.enabled" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.operations.storeNamespace }}
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operation-store
  namespace: {{ .Values.operations.storeNamespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operation-store
  namespace: {{ .Values.operations.storeNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operation-store
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
